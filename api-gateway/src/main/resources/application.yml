server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
  cloud:
    config:
      enabled: false

jwt:
  public-key: classpath:keys/public.pem

management:
  endpoints:
    web:
      exposure:
        include: health,info,liveness,readiness
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    kafka:
      enabled: false
    redis:
      enabled: false
    binders:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: "ArthSetu Digital Banking Platform"
    description: "High-throughput distributed digital banking platform built with Spring Cloud Gateway, Java 21, and Spring Boot 3"
    version: "1.0.0"
    developer: "Kritika Khandelwal"
    status: "Active / Healthy"
    architecture: "Spring Cloud Gateway, Java 21, Spring Boot 3"
    features:
      - "Distributed Saga Choreography"
      - "Redis Distributed Locking"
      - "Kafka Event Bus"